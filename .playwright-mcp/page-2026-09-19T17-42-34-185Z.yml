        - heading "🎯 Your task" [level=2] [ref=f4e34]
        - paragraph [ref=f4e35]: "Kill the classic \"a popup swallowed my click\" flake — declaratively: A promotional overlay pops up on this page on its own schedule and blocks every click until dismissed (this is what cookie walls, notification permission prompts and \"loading\" spinners feel like in real apps). 1. First, feel the pain: write a test that clicks the four \"Add to cart\" buttons WITHOUT any special handling — it times out whenever the overlay is up. 2. Fix it with ONE registration before acting: page.addLocatorHandler(page.getByTestId('promo-overlay'), dismissIt). Playwright now auto-dismisses the overlay whenever it intercepts an action, then retries the click. 3. Assert all four products end up in the cart, and that the overlay was dismissed at least once along the way (the counter increments on every close)."
