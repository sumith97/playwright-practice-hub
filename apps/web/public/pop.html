<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Popup</title>
    <style>
      body { font-family: system-ui, sans-serif; margin: 0; padding: 18px; background: #f5f3ff; }
      h2 { margin: 0 0 6px; font-size: 1.05rem; }
      p { color: #4c4177; }
      button { padding: 6px 12px; border: none; border-radius: 6px; background: #7c3aed; color: #fff; font-weight: 600; cursor: pointer; }
      #popup-status { min-height: 1.2em; font-weight: 700; color: #16803c; }
    </style>
  </head>
  <body>
    <h2 id="popup-title">Popup window</h2>
    <p>This page was opened as <strong id="popup-kind">a popup</strong>.</p>
    <button id="send-greeting">Send greeting to opener</button>
    <p id="popup-status"></p>
    <script>
      const params = new URLSearchParams(location.search);
      const kind = params.get('kind') || 'popup';
      document.getElementById('popup-kind').textContent = '"' + kind + '"';
      document.getElementById('popup-title').textContent = kind === 'tab' ? 'New tab page' : 'Popup window';

      document.getElementById('send-greeting').addEventListener('click', () => {
        const text = 'Hi from the ' + kind + ' page!';
        document.getElementById('popup-status').textContent = 'Greeting sent to the opener.';
        if (window.opener && !window.opener.closed) {
          window.opener.postMessage({ type: 'popup-greeting', text: text }, '*');
        }
      });
    </script>
  </body>
</html>
