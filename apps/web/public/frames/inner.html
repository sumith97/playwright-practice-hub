<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Inner frame</title>
    <style>
      body { font-family: system-ui, sans-serif; margin: 0; padding: 12px; background: #f0f4ff; }
      h2 { margin: 0 0 8px; font-size: 1rem; }
      label { font-weight: 600; font-size: 0.85rem; display: block; margin-bottom: 4px; }
      input { padding: 4px 8px; border: 1px solid #b9c0d4; border-radius: 6px; }
      button { padding: 5px 10px; border: none; border-radius: 6px; background: #4f46e5; color: #fff; font-weight: 600; cursor: pointer; }
      #inner-status { min-height: 1.2em; font-size: 0.85rem; color: #16803c; font-weight: 700; }
      iframe { width: 100%; height: 150px; border: 1px solid #b9c0d4; border-radius: 6px; background: #fff; margin-top: 8px; }
    </style>
  </head>
  <body>
    <h2>Inner frame — first level</h2>
    <label for="inner-input">Your name</label>
    <input id="inner-input" placeholder="type-here" />
    <button id="greet-parent">Greet parent</button>
    <p id="inner-status"></p>
    <iframe id="deep-frame" src="/frames/deep.html" title="Deep frame"></iframe>
    <script>
      document.getElementById('greet-parent').addEventListener('click', () => {
        const name = document.getElementById('inner-input').value || 'stranger';
        const text = 'Hello ' + name + ', from the inner frame!';
        document.getElementById('inner-status').textContent = 'Greeting sent to parent.';
        parent.postMessage({ type: 'iframe-greeting', text: text }, '*');
      });
    </script>
  </body>
</html>
