name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    timeout-minutes: 40
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Typecheck the web app
        run: npm run typecheck

      - name: Run reference suite (shard ${{ matrix.shard }}/3)
        run: npx playwright test --shard=${{ matrix.shard }}/3

      - name: Upload blob report (merged by the "report" job)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blob-report-${{ matrix.shard }}
          path: blob-report/
          retention-days: 7

      - name: Upload trace artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: traces-shard-${{ matrix.shard }}
          path: test-results/
          retention-days: 7

  # Merges every shard's blob report into ONE browsable HTML report and
  # appends the totals to the run summary — runs even when tests fail.
  report:
    needs: test
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download blob reports from all shards
        uses: actions/download-artifact@v4
        with:
          path: all-blobs
          pattern: blob-report-*
          merge-multiple: true

      - name: Merge into a single HTML report
        run: npx playwright merge-reports --reporter=html ./all-blobs

      - name: Append result totals to the run summary
        if: always()
        run: |
          npx playwright merge-reports --reporter=json ./all-blobs > merged.json
          node -e '
            const { stats } = require("./merged.json");
            const row = (label, v) => "| " + label + " | " + v + " |";
            const md = [
              "## 📊 Reference suite results",
              "",
              "| Metric | Value |",
              "|---|---|",
              row("✅ Passed", stats.expected),
              row("❌ Failed", stats.unexpected),
              row("😵 Flaky", stats.flaky),
              row("⏭️ Skipped", stats.skipped),
              row("⏱️ Duration", (stats.duration / 1000).toFixed(1) + "s"),
              "",
            ].join("\n");
            require("fs").appendFileSync(process.env.GITHUB_STEP_SUMMARY, md);
          '

      - name: Upload merged HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  # Optional: publish the merged report to GitHub Pages for a permanent URL.
  # Requires Pages to be available (public repo, or paid plan for private
  # repos) and Settings → Pages → Source: GitHub Actions. To enable, uncomment
  # and add `pages: write` + `id-token: write` permissions, then set the
  # artifact's path below.
