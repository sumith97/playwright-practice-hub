name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    timeout-minutes: 40
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Typecheck the web app
        run: npm run typecheck

      - name: Run reference suite (shard ${{ matrix.shard }}/3)
        run: npx playwright test --shard=${{ matrix.shard }}/3

      - name: Upload blob report (merged by the "report" job)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blob-report-${{ matrix.shard }}
          path: blob-report/
          retention-days: 7

      - name: Upload trace artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: traces-shard-${{ matrix.shard }}
          path: test-results/
          retention-days: 7

  # Merges every shard's blob report into ONE browsable HTML report, appends
  # the totals to the run summary, and records the run into the `test-history`
  # branch for the analysis dashboard — runs even when tests fail.
  report:
    needs: test
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: test-history
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download blob reports from all shards
        uses: actions/download-artifact@v4
        with:
          path: all-blobs
          pattern: blob-report-*
          merge-multiple: true

      - name: Merge into a single HTML report
        run: npx playwright merge-reports --reporter=html ./all-blobs

      - name: Append result totals to the run summary
        if: always()
        run: |
          npx playwright merge-reports --reporter=json ./all-blobs > merged.json
          node -e '
            const { stats } = require("./merged.json");
            const row = (label, v) => "| " + label + " | " + v + " |";
            const md = [
              "## 📊 Reference suite results",
              "",
              "| Metric | Value |",
              "|---|---|",
              row("✅ Passed", stats.expected),
              row("❌ Failed", stats.unexpected),
              row("😵 Flaky", stats.flaky),
              row("⏭️ Skipped", stats.skipped),
              row("⏱️ Duration", (stats.duration / 1000).toFixed(1) + "s"),
              "",
            ].join("\n");
            require("fs").appendFileSync(process.env.GITHUB_STEP_SUMMARY, md);
          '

      - name: Record run into test history (test-history branch)
        if: always()
        run: |
          if [ ! -f merged.json ]; then echo "no merged.json — skipping history"; exit 0; fi
          node tools/test-history/collect.mjs merged.json --out run-record.json --source ci \
            --run-id "${GITHUB_RUN_ID}" \
            --run-url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            --sha "${GITHUB_SHA}" \
            --branch "${GITHUB_REF_NAME}" \
            --event "${GITHUB_EVENT_NAME}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git fetch --depth=1 origin test-history 2>/dev/null; then
            git show FETCH_HEAD:history.jsonl > history.jsonl 2>/dev/null || echo "" > history.jsonl
            parent="$(git rev-parse FETCH_HEAD)"
          else
            echo "first CI run — creating test-history branch" > history.jsonl
            parent=""
          fi

          # append into the STAGING file at the repo root (the one git commits below)
          node tools/test-history/cli.mjs append run-record.json history.jsonl

          blob="$(git hash-object -w history.jsonl)"
          tree="$(printf '100644 blob %s\thistory.jsonl\n' "$blob" | git mktree)"
          if [ -n "$parent" ]; then
            commit="$(git commit-tree "$tree" -p "$parent" -m "chore(test-history): run ${GITHUB_RUN_ID}")"
          else
            commit="$(git commit-tree "$tree" -m "chore(test-history): run ${GITHUB_RUN_ID}")"
          fi
          git push origin "$commit:refs/heads/test-history"
          echo "history pushed to test-history branch"

      - name: Upload merged HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  # Optional: publish the merged report to GitHub Pages for a permanent URL.
  # Requires Pages to be available (public repo, or paid plan for private
  # repos) and Settings → Pages → Source: GitHub Actions. To enable, uncomment
  # and add `pages: write` + `id-token: write` permissions, then set the
  # artifact's path below.
  # pages:
  #   needs: report
  #   if: github.ref == 'refs/heads/main'
  #   runs-on: ubuntu-latest
  #   permissions:
  #     pages: write
  #     id-token: write
  #   environment:
  #     name: github-pages
  #     url: ${{ steps.deployment.outputs.page_url }}
